name: build

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libegl-dev libgles-dev libegl-mesa0 libgl1-mesa-dri \
            libx11-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev libxss-dev libxfixes-dev \
            libxtst-dev libxinerama-dev libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev \
            libdrm-dev libgbm-dev libasound2-dev libpulse-dev libibus-1.0-dev
      - name: Build and test
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build
          ctest --test-dir build --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: build/test-output

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
      - name: Build (WebGL 1)
        run: |
          emcmake cmake -S . -B build-web -DCMAKE_BUILD_TYPE=Release -DOSE_UI_BUILD_TESTS=OFF
          cmake --build build-web
      - uses: actions/upload-artifact@v4
        with:
          name: web-demo
          path: |
            build-web/ose_ui_demo.html
            build-web/ose_ui_demo.js
            build-web/ose_ui_demo.wasm
            build-web/ose_ui_demo.data
